[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptpump"
version = "0.1.0"
description = "Deterministic context-engineering engine and prompt compiler powered by a local Ollama model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ritesh Nipane" }]
keywords = ["prompt-engineering", "ollama", "llm", "cli", "context-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "requests>=2.31",
    "pyperclip>=1.8",
    "pathspec>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/RiteshNipane/PromptPump"
Issues = "https://github.com/RiteshNipane/PromptPump/issues"

[project.scripts]
promptpump = "promptpump.cli:app"

[tool.setuptools.packages.find]
include = ["promptpump*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
